<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}</style>
<title>국민건강보험법 퀴즈</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;600&display=swap">
<style>
/* 레이아웃: 폰 한 손 조작 기준의 단일 컬럼 카드. 하단 고정 버튼 바 + 조문 원문은 세리프 인용 블록 */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --ink:#13202B; --muted:#5A6978; --line:#D5DCE3;
  --accent:#1F3F8F; --accent-ink:#FFFFFF; --accent-soft:#E3EAF8;
  --ok:#17794A; --ok-soft:#DDF3E7; --bad:#B3261E; --bad-soft:#FBE4E1;
  --amend:#8A5A00; --amend-soft:#FFEFC9; --quote:#F6F8FA;
  --sans:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --serif:"Noto Serif KR","Batang",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F161D; --surface:#18222C; --ink:#E7EDF2; --muted:#9AA9B7; --line:#2C3946;
  --accent:#8FB0FF; --accent-ink:#0B1630; --accent-soft:#1E2B47;
  --ok:#5FD39A; --ok-soft:#16352A; --bad:#FF8E85; --bad-soft:#3C1B19;
  --amend:#F2C25B; --amend-soft:#3A2E10; --quote:#131C25; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F161D; --surface:#18222C; --ink:#E7EDF2; --muted:#9AA9B7; --line:#2C3946;
  --accent:#8FB0FF; --accent-ink:#0B1630; --accent-soft:#1E2B47;
  --ok:#5FD39A; --ok-soft:#16352A; --bad:#FF8E85; --bad-soft:#3C1B19;
  --amend:#F2C25B; --amend-soft:#3A2E10; --quote:#131C25; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;
  padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  word-break:keep-all;overflow-wrap:anywhere}
#app{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:1.5rem;line-height:1.3;margin:0;text-wrap:balance}
h2{font-size:1.05rem;margin:0}
p{margin:0}
.muted{color:var(--muted);font-size:.88rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{font-size:.78rem;font-weight:500;padding:2px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.amend{background:var(--amend-soft);color:var(--amend)}
.chip.trap{background:var(--bad-soft);color:var(--bad)}
.chip.plain{background:var(--quote);color:var(--muted);border:1px solid var(--line)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{min-height:52px;padding:0 20px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;width:100%}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{min-height:44px;width:auto;font-weight:500}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{min-height:44px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface)}
.filters button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.chap{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.chap:first-child{border-top:0}
.chap.off{color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
.stem{font-weight:500;font-size:1.05rem;white-space:pre-line}
.box{border:1px solid var(--ink);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-family:var(--serif);font-size:.98rem}
.box div{display:flex;gap:8px}
.box b{flex:none}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;text-align:left;align-items:flex-start;min-height:52px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);width:100%}
.opt .n{flex:none;font-weight:700;color:var(--muted);min-width:1.4em}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.verdict{font-weight:700;display:flex;align-items:center;gap:8px}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.notes{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.notes li{display:flex;gap:8px;font-size:.93rem}
.notes .l{flex:none;font-weight:700;min-width:1.4em}
.tag{flex:none;font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:4px;height:fit-content;margin-top:3px}
.tag.t{background:var(--ok-soft);color:var(--ok)} .tag.f{background:var(--bad-soft);color:var(--bad)}
.quote{background:var(--quote);border-left:3px solid var(--accent);padding:10px 12px;font-family:var(--serif);font-size:.93rem;white-space:pre-line}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dock>div{max-width:640px;margin:0 auto;display:flex;gap:8px}
.score{font-size:2.4rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.res{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:.93rem}
.res:first-child{border-top:0}
.res .m{flex:none;font-weight:700;width:1.4em}
.res .m.ok{color:var(--ok)} .res .m.bad{color:var(--bad)}
details{border-top:1px solid var(--line);padding:10px 0}
summary{cursor:pointer;min-height:36px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details>.inner{display:flex;flex-direction:column;gap:10px;padding-top:8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.link{background:none;border:0;color:var(--accent);padding:8px 0;min-height:44px;text-decoration:underline}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .25s}}
</style>

<style>
[hidden]{display:none!important}
.chrow{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left}
.chrow[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.chrow[disabled]{opacity:.5;cursor:default}
.ck{flex:none;width:22px;height:22px;border:2px solid var(--line);border-radius:6px;display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--accent-ink)}
.chrow[aria-pressed="true"] .ck{background:var(--accent);border-color:var(--accent)}
.chrow .grow{flex:1;min-width:0}
.chrow .sub{font-size:.82rem;color:var(--muted)}
.chlist{display:flex;flex-direction:column;gap:8px}
.lite{display:flex;flex-direction:column;gap:10px}
</style>
</head>
<body>
<div id="app"></div>
<div class="dock" id="dock" hidden><div id="dockInner"></div></div>
<script src="data1.js"></script>
<script src="data.js"></script>
<script>
/* ===== 데이터: 제1장은 data1.js(보기형 포함), 제2~9장은 data.js(암기 확인용) ===== */
var Q=(window.Q1||[]).concat(window.QL||[]);
Q.forEach(function(q){if(!q.ch)q.ch=1});
var TYPE={box:"보기형",choice:"선택형",ox:"OX",blank:"빈칸"};
var CIRC=["①","②","③","④"];
var CHN={1:"총칙",2:"가입자",3:"국민건강보험공단",4:"보험급여",5:"건강보험심사평가원",6:"보험료",7:"이의신청 및 심판청구 등",8:"보칙",9:"벌칙"};

/* ===== 저장소 (이 기기·브라우저에만 저장) ===== */
var store={wrong:{},log:[],stat:{},pref:{}};
function loadStore(){try{var s=localStorage.getItem("nhi-quiz-v1");if(s){var o=JSON.parse(s);store.wrong=o.wrong||{};store.log=o.log||[];store.stat=o.stat||{};store.pref=o.pref||{}}}catch(e){}}
function saveStore(){try{localStorage.setItem("nhi-quiz-v1",JSON.stringify(store))}catch(e){}}

/* ===== 상태 ===== */
var S={view:"home",filter:"all",size:10,amend:false,chs:{},mode:"normal",list:[],i:0,sel:null,done:false,res:[],confirmClear:false};
var $app=document.getElementById("app"),$dock=document.getElementById("dock"),$dockInner=document.getElementById("dockInner");
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function byId(id){for(var k=0;k<Q.length;k++)if(Q[k].id===id)return Q[k]}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function wrongIds(){return Object.keys(store.wrong).filter(function(id){return byId(id)})}
function counts(){var c={};Q.forEach(function(q){c[q.ch]=(c[q.ch]||0)+1});return c}
function tagsOf(q){return q.trap?q.trap.map(function(t){return t.g}):[q.tag]}
function showDock(html){$dock.hidden=false;$dockInner.innerHTML=html}
function hideDock(){$dock.hidden=true;$dockInner.innerHTML=""}
function go(v){S.view=v;render();window.scrollTo(0,0)}
function savePref(){store.pref={filter:S.filter,size:S.size,amend:S.amend,chs:S.chs};saveStore()}
function initPref(){
  var p=store.pref,c=counts();S.filter=p.filter||"all";S.size=p.size===undefined?10:p.size;S.amend=!!p.amend;S.chs={};
  Object.keys(c).forEach(function(k){S.chs[k]=p.chs&&p.chs[k]!==undefined?p.chs[k]:true});
}
function pool(){
  return Q.filter(function(q){return S.chs[q.ch]&&(S.filter==="all"||q.type===S.filter)&&(!S.amend||q.amend)});
}

function start(mode){
  var p;
  if(mode==="wrong"){var w=wrongIds();p=Q.filter(function(q){return w.indexOf(q.id)>-1})}
  else{p=pool()}
  if(!p.length)return;
  p=shuffle(p);if(mode!=="wrong"&&S.size>0)p=p.slice(0,S.size);
  S.mode=mode;S.list=p;S.i=0;S.sel=null;S.done=false;S.res=[];
  go("quiz");
}
function check(){
  var q=S.list[S.i],ok=S.sel===q.ans;S.done=true;S.res[S.i]={id:q.id,ok:ok};
  if(ok){delete store.wrong[q.id]}else{var w=store.wrong[q.id]||{n:0};w.n++;w.t=Date.now();store.wrong[q.id]=w}
  var st=store.stat[q.ch]||{c:0,n:0};st.n++;if(ok)st.c++;store.stat[q.ch]=st;
  saveStore();render();
  var e=document.getElementById("fb");if(e&&e.scrollIntoView)e.scrollIntoView({block:"nearest"});
}
function next(){
  if(S.i<S.list.length-1){S.i++;S.sel=null;S.done=false;render();window.scrollTo(0,0)}
  else{
    var c=S.res.filter(function(r){return r&&r.ok}).length;
    store.log.push({t:Date.now(),c:c,n:S.list.length,m:S.mode});store.log=store.log.slice(-50);saveStore();go("result")
  }
}

/* ===== 화면 조각 ===== */
function boxHtml(q){return q.box?'<div class="box">'+q.box.map(function(b){return '<div><b>'+b.k+'.</b><span>'+esc(b.t)+'</span></div>'}).join("")+'</div>':''}
function noteList(q){
  return '<ul class="notes">'+q.notes.map(function(n){
    return '<li><span class="l">'+esc(n.l)+'</span><span class="tag '+(n.ok?'t':'f')+'">'+(n.ok?'옳은 내용':'틀린 내용')+'</span><span>'+esc(n.t)+'</span></li>'
  }).join("")+'</ul>';
}
function answerText(q){return q.type==="box"||q.type==="ox"?q.opts[q.ans]:CIRC[q.ans]+" "+q.opts[q.ans]}
function explain(q){
  if(!q.notes){
    return '<div class="card lite"><p>'+esc(q.exp)+'</p><div class="quote">'+esc(q.src)+'</div>'
     +'<div class="row"><span class="chip trap">'+esc(q.tag)+'</span><span class="muted">'+esc(q.art)+(q.amend?' · 시행예정 기준':'')+'</span></div></div>';
  }
  return '<div class="card" style="gap:14px">'
   +'<div><b>해설</b></div>'+noteList(q)
   +'<div><div class="muted" style="margin-bottom:6px">근거 조문 (시행예정 반영본)</div><div class="quote">'+esc(q.src)+'</div></div>'
   +'<div><div class="muted" style="margin-bottom:6px">함정 포인트</div>'
   +q.trap.map(function(t){return '<p style="margin-bottom:6px"><span class="chip trap">'+esc(t.g)+'</span> '+esc(t.t)+'</p>'}).join("")+'</div></div>';
}

/* ===== 화면 ===== */
function renderHome(){
  var c=counts(),w=wrongIds().length,last=store.log.length?store.log[store.log.length-1]:null,p=pool().length;
  var filt=[["all","전체"],["ox","OX"],["blank","빈칸"],["choice","선택형"],["box","보기형"]];
  var sizes=[[10,"10문제"],[20,"20문제"],[0,"전체"]];
  var shown=S.size>0?Math.min(S.size,p):p;
  var n=Object.keys(CHN);
  $app.innerHTML=
   '<header class="card" style="gap:8px"><h1>국민건강보험법 퀴즈</h1>'
   +'<p class="muted">기준 법령: 제21522호(2026. 10. 8. 시행) + 시행예정 개정(2026. 11. 27. / 12. 24. / 2027. 1. 1.) 반영. 시행령·시행규칙 제외.</p>'
   +(last?'<p class="muted">최근 기록: '+last.c+' / '+last.n+'문제 정답</p>':'')+'</header>'
   +'<section class="card"><h2>범위 선택</h2><div class="chlist">'
   +n.map(function(k){var cnt=c[k]||0,st=store.stat[k];
     var sub=cnt?cnt+'문제'+(st&&st.n?' · 정답률 '+Math.round(st.c/st.n*100)+'% ('+st.n+'회 풀이)':''):'준비 중';
     return '<button class="chrow" data-ch="'+k+'" aria-pressed="'+(!!S.chs[k])+'"'+(cnt?'':' disabled')+'><span class="ck">'+(S.chs[k]?'✓':'')+'</span><span class="grow">제'+k+'장 '+esc(CHN[k])+'<div class="sub">'+sub+'</div></span></button>'}).join("")
   +'</div><div class="row"><button class="btn small" id="allOn">전체 선택</button><button class="btn small" id="allOff">전체 해제</button></div></section>'
   +'<section class="card"><h2>문제 유형</h2><div class="filters" role="group" aria-label="문제 유형">'
   +filt.map(function(f){return '<button data-f="'+f[0]+'" aria-pressed="'+(S.filter===f[0])+'">'+f[1]+'</button>'}).join("")+'</div>'
   +'<h2 style="margin-top:4px">문제 수</h2><div class="filters" role="group" aria-label="문제 수">'
   +sizes.map(function(f){return '<button data-s="'+f[0]+'" aria-pressed="'+(S.size===f[0])+'">'+f[1]+'</button>'}).join("")+'</div>'
   +'<h2 style="margin-top:4px">개정 조문</h2><div class="filters"><button id="amendBtn" aria-pressed="'+S.amend+'">시행예정 개정 조문만 풀기</button></div></section>'
   +'<section class="card"><h2>오답노트</h2><p class="muted">틀린 문제는 자동으로 쌓이고, 다시 맞히면 빠집니다. 이 기기의 브라우저에만 저장됩니다.</p>'
   +'<div class="row"><button class="btn small" id="goWrong">오답노트 보기 ('+w+')</button></div></section>';
  showDock('<button class="btn primary" id="startBtn"'+(p?'':' disabled')+'>'+(p?shown+'문제 풀기':'조건에 맞는 문제가 없어요')+'</button>');
  $app.querySelectorAll("[data-ch]").forEach(function(b){b.onclick=function(){S.chs[b.dataset.ch]=!S.chs[b.dataset.ch];savePref();renderHome()}});
  $app.querySelectorAll("[data-f]").forEach(function(b){b.onclick=function(){S.filter=b.dataset.f;savePref();renderHome()}});
  $app.querySelectorAll("[data-s]").forEach(function(b){b.onclick=function(){S.size=+b.dataset.s;savePref();renderHome()}});
  document.getElementById("amendBtn").onclick=function(){S.amend=!S.amend;savePref();renderHome()};
  document.getElementById("allOn").onclick=function(){Object.keys(c).forEach(function(k){S.chs[k]=true});savePref();renderHome()};
  document.getElementById("allOff").onclick=function(){Object.keys(c).forEach(function(k){S.chs[k]=false});savePref();renderHome()};
  document.getElementById("startBtn").onclick=function(){start("normal")};
  document.getElementById("goWrong").onclick=function(){go("wrong")};
}

function renderQuiz(){
  var q=S.list[S.i],pct=Math.round((S.i+(S.done?1:0))/S.list.length*100);
  var h='<div class="top"><button class="link" id="quit" style="padding:0">← 나가기</button><span class="muted">'+(S.i+1)+' / '+S.list.length+'</span></div>'
   +'<div class="bar" aria-hidden="true"><i style="width:'+pct+'%"></i></div>'
   +'<section class="card"><div class="row"><span class="chip">제'+q.ch+'장 · '+esc(q.art)+'</span><span class="chip plain">'+TYPE[q.type]+'</span>'+(q.amend?'<span class="chip amend">개정 반영</span>':'')+'</div>'
   +'<p class="stem">'+esc(q.stem)+'</p>'+boxHtml(q)
   +'<div class="opts">'+q.opts.map(function(o,k){
    var cls="opt",pressed=S.sel===k;
    if(S.done){if(k===q.ans)cls+=" ok";else if(k===S.sel)cls+=" bad"}
    var lead=q.type==="ox"?"":'<span class="n">'+CIRC[k]+'</span>';
    return '<button class="'+cls+'" data-k="'+k+'" aria-pressed="'+pressed+'"'+(S.done?' disabled':'')+'>'+lead+'<span>'+esc(o)+'</span></button>'
  }).join("")+'</div></section>';
  if(S.done){
    var ok=S.sel===q.ans;
    h+='<div id="fb"><div class="verdict '+(ok?'ok':'bad')+'" style="margin-bottom:12px">'+(ok?'정답입니다':'오답입니다 · 정답: '+esc(answerText(q)))+'</div>'+explain(q)+'</div>';
  }
  $app.innerHTML=h;
  $app.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){
    if(S.done)return;S.sel=+b.dataset.k;
    if(q.type==="box")renderQuiz();else check();
  }});
  document.getElementById("quit").onclick=function(){go("home")};
  if(S.done)showDock('<button class="btn primary" id="act">'+(S.i<S.list.length-1?'다음 문제':'결과 보기')+'</button>');
  else if(q.type==="box")showDock('<button class="btn primary" id="act"'+(S.sel===null?' disabled':'')+'>정답 확인</button>');
  else hideDock();
  var a=document.getElementById("act");if(a)a.onclick=S.done?next:check;
}

function renderResult(){
  var c=S.res.filter(function(r){return r&&r.ok}).length,n=S.list.length,wrong=S.res.filter(function(r){return r&&!r.ok});
  var tags={};wrong.forEach(function(r){tagsOf(byId(r.id)).forEach(function(t){tags[t]=(tags[t]||0)+1})});
  var tagHtml=Object.keys(tags).map(function(k){return '<span class="chip trap">'+esc(k)+' '+tags[k]+'</span>'}).join(" ");
  $app.innerHTML=
   '<section class="card"><p class="muted">결과</p><div class="score">'+c+' / '+n+'</div>'
   +(wrong.length?'<div><p class="muted" style="margin-bottom:6px">많이 틀린 유형</p><div class="row">'+tagHtml+'</div></div>':'<p>모두 맞혔습니다.</p>')+'</section>'
   +'<section class="card"><h2>문항별 결과</h2><div>'
   +S.list.map(function(q,k){var r=S.res[k]||{ok:false};
     return '<div class="res"><span class="m '+(r.ok?'ok':'bad')+'">'+(r.ok?'○':'×')+'</span><span><b>제'+q.ch+'장 '+esc(q.art)+'</b> · '+esc(q.stem.split("\n")[0])+'</span></div>'}).join("")
   +'</div></section>';
  var w=wrongIds().length;
  showDock((w?'<button class="btn" id="rw">오답 다시 풀기 ('+w+')</button>':'')+'<button class="btn primary" id="again">처음으로</button>');
  if(w)document.getElementById("rw").onclick=function(){start("wrong")};
  document.getElementById("again").onclick=function(){go("home")};
}

function renderWrong(){
  var ids=wrongIds().sort(function(a,b){return store.wrong[b].t-store.wrong[a].t});
  var h='<div class="top"><button class="link" id="back" style="padding:0">← 홈</button><span class="muted">'+ids.length+'문제</span></div><h1>오답노트</h1>';
  if(!ids.length){h+='<section class="card"><p>아직 틀린 문제가 없습니다. 문제를 풀면 틀린 문제가 여기에 쌓입니다.</p></section>'}
  else{
    h+='<section class="card" style="padding-block:4px">'+ids.map(function(id){var q=byId(id);
      return '<details><summary><span class="chip">제'+q.ch+'장 · '+esc(q.art)+'</span><span class="chip plain">'+TYPE[q.type]+'</span><span class="muted">'+store.wrong[id].n+'회 오답</span></summary><div class="inner">'
       +'<p class="stem">'+esc(q.stem)+'</p>'+boxHtml(q)
       +'<p><b>정답:</b> '+esc(answerText(q))+'</p>'+(q.notes?noteList(q):'<p>'+esc(q.exp)+'</p>')
       +'<div class="quote">'+esc(q.src)+'</div></div></details>'}).join("")+'</section>';
    h+='<section class="card"><button class="btn small danger" id="clr">'+(S.confirmClear?'정말 비울까요? 한 번 더 누르면 삭제':'오답노트 비우기')+'</button></section>';
  }
  $app.innerHTML=h;
  document.getElementById("back").onclick=function(){go("home")};
  var c=document.getElementById("clr");
  if(c)c.onclick=function(){if(!S.confirmClear){S.confirmClear=true;renderWrong();return}store.wrong={};saveStore();S.confirmClear=false;renderWrong()};
  if(ids.length)showDock('<button class="btn primary" id="rw2">오답만 다시 풀기</button>');else hideDock();
  var r=document.getElementById("rw2");if(r)r.onclick=function(){start("wrong")};
}

function render(){
  if(S.view==="home")renderHome();
  else if(S.view==="quiz")renderQuiz();
  else if(S.view==="result")renderResult();
  else renderWrong();
}
loadStore();initPref();render();
</script>
</body>
</html>
